<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-3">
        <div class="card border-0 shadow rounded-4 p-3" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-2">
                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" width="50" height="50" alt="Logo"
                    class="mb-2">
                <h4 class="fw-bold mb-1">Welcome Back</h4>
                <p class="text-secondary small mb-2">
                    Login to continue to your account
                </p>
            </div>

            <form id="login-form">
                <div class="mb-2">
                    <label class="form-label fw-semibold mb-1">
                        Email Address
                    </label>
                    <input type="email" id="login-email" class="form-control rounded-3" placeholder="name@example.com"
                        required>
                </div>

                <div class="mb-2">
                    <label class="form-label fw-semibold mb-1">
                        Password
                    </label>
                    <input type="password" id="login-password" class="form-control rounded-3"
                        placeholder="Enter your password" required>
                </div>

                <div id="auth-message"></div>
                <button type="submit" id="login-button" class="btn btn-primary w-100 rounded-3 fw-semibold mt-2">
                    Login
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-secondary small">
                    Don't have an account?
                </span>
                <a href="signup.html" class="text-primary fw-semibold text-decoration-none small">
                    Sign Up
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
    <script type="module" src="./dashboard.js"></script>
    <script type="module" src="./firebase.config.js"></script>
</body>

</html>
