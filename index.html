<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nova</title>

    <link rel="icon" type="image/png"
        href="https://cdn-icons-png.flaticon.com/512/1006/1006771.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="text-center mb-4">

                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png"
                    class="auth-logo mb-3"
                    alt="Nova Logo">

                <h2>Welcome Back!</h2>

                <p class="text-secondary small">
                    Login to continue to your Nova account.
                </p>

            </div>


            <!-- Login Form -->

            <form id="login-form">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input type="email"
                        id="login-email"
                        class="form-control"
                        placeholder="name@example.com"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <input type="password"
                        id="login-password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>


                <div id="auth-message"></div>


                <button type="submit"
                    id="login-button"
                    class="btn btn-primary w-100 mt-3">

                    Login to Account

                </button>

            </form>


            <div class="text-center mt-4">

                <span class="text-secondary small">
                    Don't have an account?
                </span>

                <a href="signup.html"
                    class="text-primary fw-bold text-decoration-none small">

                    Sign Up

                </a>

            </div>

        </div>

    </div>


    <!-- Bootstrap Toast Notification -->

    <div class="toast-container position-fixed top-0 end-0 p-3"
        style="z-index: 9999;">

        <div id="notification-toast"
            class="toast border-0 shadow"
            role="alert"
            aria-live="assertive"
            aria-atomic="true">

            <div class="d-flex align-items-center">

                <div class="toast-body" id="toast-message">

                    Notification message

                </div>

                <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"
                    aria-label="Close">

                </button>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->

    <script type="module" src="./index.js"></script>

</body>

</html>
