<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Nova</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar bg-white shadow-sm py-3">
        <div class="container">

            <a href="dashboard.html"
                class="navbar-brand d-flex align-items-center fw-bold fs-4 text-dark">

                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png"
                    width="40" height="40" alt="Nova Logo" class="me-2">

                Nova

            </a>

            <button id="logout"
                class="btn btn-outline-danger rounded-3 px-4 fw-semibold">

                Logout

            </button>

        </div>
    </nav>


    <main class="container py-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold text-dark" id="greeting-text">
                Welcome!
            </h1>

        </div>


        <div class="card border-0 shadow-sm rounded-4 p-4 mx-auto"
            style="max-width: 600px;">

            <h4 class="fw-bold mb-3">
                My Todo App
            </h4>

            <form id="todo-form">

                <div class="input-group">

                    <input
                        type="text"
                        id="todo-input"
                        class="form-control"
                        placeholder="Enter your todo..."
                        required
                    >

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="todo-btn">

                        Add Todo

                    </button>

                </div>

            </form>

        </div>


        <div class="mx-auto mt-4" style="max-width: 600px;">

            <h5 class="fw-bold mb-3">
                My Todos
            </h5>

            <ul id="todos-list" class="list-group shadow-sm"></ul>

        </div>

    </main>


    <script type="module" src="./index.js"></script>
    <script type="module" src="./dashboard.js"></script>

</body>

</html>
