<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Nova</title>

    <link rel="icon" type="image/png"
    href="https://cdn-icons-png.flaticon.com/512/1006/1006771.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg py-3 sticky-top">

        <div class="container">

            <a href="dashboard.html" class="navbar-brand d-flex align-items-center">

                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png"
                    class="brand-logo me-2" alt="Nova">

                Nova

            </a>

            <button class="btn btn-outline-danger rounded-3 px-3 fw-semibold"
                id="logout">

                <i class="bi bi-box-arrow-right me-1"></i>
                Logout

            </button>

        </div>

    </nav>


    <!-- Main Dashboard -->

    <main class="container py-5">

        <div class="dashboard-wrapper">

            <!-- Welcome Section -->

            <section class="welcome-section mb-4">

                <div class="position-relative" style="z-index:1;">

                    <span class="badge bg-white text-primary rounded-pill px-3 py-2 mb-3">
                        <i class="bi bi-stars me-1"></i>
                        Your Personal Workspace
                    </span>

                    <h1 id="greeting-text">
                        Welcome to Nova!
                    </h1>

                    <p class="mb-0">
                        Stay organized, manage your tasks and make every day productive.
                    </p>

                </div>

            </section>


            <!-- Todo Input -->

            <section class="todo-card mb-4">

                <div class="d-flex align-items-center mb-4">

                    <div class="bg-primary bg-opacity-10 rounded-3 p-3 me-3">

                        <i class="bi bi-plus-circle-fill text-primary fs-4"></i>

                    </div>

                    <div>

                        <h4 class="mb-1">Create a New Task</h4>

                        <p class="text-secondary small mb-0">
                            Add something you want to accomplish.
                        </p>

                    </div>

                </div>


                <form id="todo-form">

                    <div class="todo-input-group">

                        <input
                            type="text"
                            id="todo-input"
                            class="form-control"
                            placeholder="What needs to be done?"
                            maxlength="250"
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-primary add-btn"
                            id="todo-btn">

                            <i class="bi bi-plus-lg me-1"></i>
                            Add Task

                        </button>

                    </div>

                </form>

            </section>


            <!-- Todo List -->

            <section>

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div>

                        <h4 class="fw-bold mb-1">
                            My Tasks
                        </h4>

                        <p class="text-secondary small mb-0">
                            Manage your daily activities.
                        </p>

                    </div>

                    <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-3 py-2"
                        id="todo-count">

                        0 Tasks

                    </span>

                </div>


                <div id="todos-list">

                    <div class="empty-state">

                        <i class="bi bi-hourglass-split fs-1"></i>

                        <p class="mt-3 mb-0">
                            Loading your tasks...
                        </p>

                    </div>

                </div>

            </section>


            <!-- Footer -->

            <footer class="text-center mt-5 pt-4 border-top">

                <p class="text-secondary small mb-0">
                    © 2026 Nova. Made for better productivity.
                </p>

            </footer>

        </div>

    </main>


    <script type="module" src="./index.js"></script>

    <script type="module" src="./dashboard.js"></script>

</body>

</html>
